[package]
name = "aurivo-pulse" # İsmi projenle uyumlu hale getirdik
license = "GPL-3.0+"
description = "A powerful open-source audio fingerprinting and music recognition client."
homepage = "https://github.com/muhammet-dali/Aurivo-Pulse"
repository = "https://github.com/muhammet-dali/Aurivo-Pulse"
version = "0.7.0" # Yeni motorla birlikte versiyon atlatıyoruz
authors = ["muhammet-dali"]
edition = "2018"

[[bin]]
name = "aurivo-pulse"
path = "src/main.rs"

[dependencies]
# --- Mevcut Bağımlılıklar (Korundu) ---
fern = "0.7"
humantime = "2.3"
log = { version = "0.4.29", features = ["kv", "kv_std"] }
chfft = "0.3.4"
async-channel = "2.5.0"
byteorder = "1.3.4"
crc32fast = "1.2.0"
base64 = "0.12.3"
rodio = "0.19.0"
clap = { version = "4.5.56", features = ["cargo"] }
cpal = "0.17.1"
serde_json = "1.0.57"
uuid = { version = "0.8.1", features = ["v4"] }
glib = { version = "0.21", features = ["log", "v2_66"] }
serde = { version = "1.0.115", features = ["derive"] }
csv = "1.1.3"
regex = "1.5.4"
rand = "0.7.3"
gettext-sys = { version = "0.19.9", features = ["gettext-system"] }
gettext-rs = { version = "0.5.0" }
tempfile = "3.24.0"
chrono = { version = "0.4.13" }
toml = "1.0.1"
soup3 = { version = "0.8.0", features = [ "v3_4" ] }

# --- Yeni Eklenen Chromaprint & AcoustID Bağımlılıkları ---
# Sistemine kurduğun libchromaprint.so ile haberleşecek olan crate
chromaprint = "0.2.0"
# AcoustID API istekleri için reqwest (blocking mod ile)
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# --- GUI Deps (Korundu) ---
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_14"], optional = true }
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_5"], optional = true }
gdk = { version = "0.10.3", package = "gdk4", optional = true }
gio = { version = "0.21.5", features = ["v2_66"], optional = true }
percent-encoding = { version = "2.1.0", optional = true }
gdk-pixbuf = { version = "0.21.5", optional = true }
directories = {version = "6.0" }
app_dirs = { version = "1.2.1" }

[build-dependencies]
gettext-sys = { version = "0.19.9", features = ["gettext-system"] }
gettext-rs = { version = "0.5.0" }
clap_mangen = "0.2.31"
clap = { version = "4.5.56", features = ["cargo"] }
flate2 = "1.1.9"
glib-build-tools = "0.21.0"

[features]
default = ["gui", "ffmpeg", "pulse", "mpris" ]
gui = ["gtk", "adw", "gdk", "gio", "percent-encoding", "ksni", "gdk-pixbuf"]
pulse = [ "pulsectl-rs", "libpulse-binding" ]
mpris = [ "mpris-player" ]
ffmpeg = []

[target.'cfg(target_os = "linux")'.dependencies]
pulsectl-rs = { version = "0.3.2", optional = true }
ksni = { version = "0.3", default-features = false, features = ["async-io"], optional = true }
libpulse-binding = { version = "2.24.0", optional = true }
mpris-player = { version = "0.6.1", optional = true }
