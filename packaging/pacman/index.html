<body>
  <h1>ArDali Pacman Repository</h1>
  <p>Add the following repository to <code>/etc/pacman.conf</code>:</p>
  <pre>[ardali]
SigLevel = Optional TrustAll
Server = https://github.com/Muhammed-Dali/ArDali-Browser/releases/download/pacman-repo</pre>
  <p>Then install with <code>sudo pacman -Syu ardali</code>.</p>
  <p><a href="ardali.repo">Download ardali.repo</a></p>
</body>
