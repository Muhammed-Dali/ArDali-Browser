name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing v-prefixed release tag to build and publish
        required: true
        default: v6.1.2

permissions:
  contents: write

jobs:
  linux-release:
    name: Portable Linux release (Debian 12 baseline)
    runs-on: ubuntu-latest
    container: debian:12
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
    steps:
      - name: Install release dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake ffmpeg gh git ninja-build nodejs \
            libssl-dev qt6-base-dev qt6-image-formats-plugins qt6-svg-dev \
            qt6-webengine-dev xauth xvfb zstd

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}

      - name: Validate tag and version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_REF}" = "v${version}"

      - name: Configure and build
        run: |
          cmake -S browser -B browser/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_BINDIR=lib/ardali-browser
          cmake --build browser/build --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: |
          xvfb-run -a ctest --test-dir browser/build --output-on-failure \
            -E '^browser-tab-attach-stress$'

      - name: Assemble portable Linux archive
        run: |
          version="${RELEASE_REF#v}"
          stage="${GITHUB_WORKSPACE}/release-root"
          DESTDIR="${stage}" cmake --install browser/build
          install -dm755 "${stage}/usr/bin"
          ln -s ../lib/ardali-browser/ardali-browser "${stage}/usr/bin/ardali-browser"
          tar --zstd -C "${stage}" -cf "ardali-browser-${version}-linux-x86_64.tar.zst" usr
          sha256sum "ardali-browser-${version}-linux-x86_64.tar.zst" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ArDali Browser ${RELEASE_REF#v}" \
            --notes-file "docs/RELEASE_NOTES_v${RELEASE_REF#v}.md" \
            "ardali-browser-${RELEASE_REF#v}-linux-x86_64.tar.zst" \
            SHA256SUMS
