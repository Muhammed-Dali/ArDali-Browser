name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    # Build in Ubuntu 24.04 so GTK4/libadwaita requirements are available.
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash

    env:
      ELECTRON_VERSION: "40.6.1"
      USE_HARD_LINKS: "false"

      npm_config_runtime: "electron"
      npm_config_target: "40.6.1"
      npm_config_disturl: "https://electronjs.org/headers"
      npm_config_build_from_source: "true"

      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate release tag matches package version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag/version mismatch: expected ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Release tag matches package version: ${EXPECTED_TAG}"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            ffmpeg \
            git \
            libchromaprint-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-4-dev \
            libfuse2 \
            libglm-dev \
            libglew-dev \
            libjpeg-dev \
            libpng-dev \
            libadwaita-1-dev \
            libasound2-dev \
            libpulse-dev \
            libsoup-3.0-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            ninja-build \
            pkg-config \
            python3 \
            rpm \
            zlib1g-dev
          update-ca-certificates || true
          rm -rf /var/lib/apt/lists/*

      - name: Build + install libprojectM v4
        run: |
          set -euo pipefail
          cmake --version

          PROJECTM_VER="4.1.6"
          curl -fsSL -o /tmp/libprojectM-${PROJECTM_VER}.tar.gz \
            "https://sourceforge.net/projects/projectm.mirror/files/v${PROJECTM_VER}/libprojectM-${PROJECTM_VER}.tar.gz/download"
          tar -xzf /tmp/libprojectM-${PROJECTM_VER}.tar.gz -C /tmp
          cmake -S "/tmp/libprojectM-${PROJECTM_VER}" -B /tmp/build-projectm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/build-projectm
          cmake --install /tmp/build-projectm
          ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci

      - name: Build native audio addon (aurivo_audio.node)
        run: npm --prefix native ci

      - name: Setup Rust toolchain (for Aurivo-Pulse)
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_INIT_SKIP_PATH_CHECK=yes
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"

          setup_rust() {
            source "$HOME/.cargo/env" 2>/dev/null || true
            command -v rustup >/dev/null 2>&1 || return 1
            rustup set profile minimal
            rustup toolchain install stable --no-self-update
            rustup default stable
            rustc --version
            cargo --version
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          }

          for attempt in 1 2 3 4 5; do
            echo "[rust-setup] attempt $attempt/5"
            if setup_rust; then
              echo "[rust-setup] ready"
              exit 0
            fi

            rm -f /tmp/rustup-init.sh
            if curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh; then
              sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable || true
            fi
            sleep $((attempt * 4))
          done

          echo "[rust-setup] failed after retries" >&2
          exit 1

      - name: Build Aurivo-Pulse binary
        run: |
          set -euo pipefail
          cargo build --release --manifest-path Aurivo-Pulse/Cargo.toml
          mkdir -p native-dist/linux
          cp -f Aurivo-Pulse/target/release/aurivo-pulse native-dist/linux/aurivo-pulse
          chmod +x native-dist/linux/aurivo-pulse

      - name: Build projectM visualizer (aurivo-projectm-visualizer)
        run: |
          set -euo pipefail
          cmake -S visualizer -B build-visualizer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-visualizer
          mkdir -p native-dist/linux
          cp -f build-visualizer/aurivo-projectm-visualizer native-dist/linux/aurivo-projectm-visualizer
          for lib in libprojectM-4.so.4 libprojectM-4-playlist.so.4; do
            if [ -f "/usr/local/lib/$lib" ]; then
              cp -Lf "/usr/local/lib/$lib" "native-dist/linux/$lib"
            elif [ -f "/usr/local/lib/x86_64-linux-gnu/$lib" ]; then
              cp -Lf "/usr/local/lib/x86_64-linux-gnu/$lib" "native-dist/linux/$lib"
            else
              echo "Missing runtime library: $lib"
              exit 1
            fi
          done
          chmod +x native-dist/linux/aurivo-projectm-visualizer

      - name: Build Linux packages (AppImage/deb/rpm)
        run: npm run -s build:linux:appimage -- --publish=never

      - name: Verify AppImage contains pulse + adblock resources
        run: |
          set -euo pipefail
          appimage="$(ls -1 dist/*.AppImage | head -n1)"
          test -n "${appimage}"
          chmod +x "${appimage}"
          tmpdir="$(mktemp -d)"
          (
            cd "${tmpdir}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
          )
          test -f "${tmpdir}/squashfs-root/resources/native-dist/linux/aurivo-pulse"
          test -f "${tmpdir}/squashfs-root/resources/uDALİ-weman-home/chromium/manifest.json"
          echo "AppImage resource check OK: aurivo-pulse + uDALİ-weman-home/chromium"

      - name: List release files
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          ls -lah dist || true

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          npm run -s release:checksums
          test -f dist/SHA256SUMS.txt

      - name: Sign checksums with GPG (optional)
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "RELEASE_GPG_PRIVATE_KEY not set; skipping signature."
            exit 0
          fi

          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "${RELEASE_GPG_PRIVATE_KEY}" | gpg --batch --import

          if [ -n "${RELEASE_GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE}" \
              --armor --detach-sign --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          else
            gpg --batch --yes --armor --detach-sign --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          fi

          test -f dist/SHA256SUMS.txt.asc
          gpg --batch --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt

      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates gnupg
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          gh --version

      - name: Create or update GitHub Release (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes
          fi

          shopt -s nullglob
          assets=(
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
            dist/SHA256SUMS.txt
          )

          if [ -f dist/SHA256SUMS.txt.asc ]; then
            assets+=(dist/SHA256SUMS.txt.asc)
          fi

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found; skipping upload."
            exit 0
          fi

          gh release upload "$TAG" "${assets[@]}" --clobber
