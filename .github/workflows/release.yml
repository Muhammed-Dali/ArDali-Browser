name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    # Use a readily available runner, but build inside an Ubuntu 20.04 container
    # to keep glibc compatibility for native binaries while avoiding runner queue delays.
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash

    env:
      ELECTRON_VERSION: "28.3.3"
      USE_HARD_LINKS: "false"

      npm_config_runtime: "electron"
      npm_config_target: "28.3.3"
      npm_config_disturl: "https://electronjs.org/headers"
      npm_config_build_from_source: "true"

      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate release tag matches package version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag/version mismatch: expected ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Release tag matches package version: ${EXPECTED_TAG}"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            ffmpeg \
            git \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfuse2 \
            libglm-dev \
            libglew-dev \
            libjpeg-dev \
            libpng-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            rpm \
            zlib1g-dev
          update-ca-certificates || true
          rm -rf /var/lib/apt/lists/*

      - name: Build + install libprojectM v4
        run: |
          set -euo pipefail
          # ubuntu:20.04 ships an older CMake; libprojectM requires >= 3.21.
          python3 -m pip install --no-cache-dir -U pip "cmake>=3.21"
          hash -r || true
          cmake --version

          PROJECTM_VER="4.1.6"
          curl -fsSL -o /tmp/libprojectM-${PROJECTM_VER}.tar.gz \
            "https://sourceforge.net/projects/projectm.mirror/files/v${PROJECTM_VER}/libprojectM-${PROJECTM_VER}.tar.gz/download"
          tar -xzf /tmp/libprojectM-${PROJECTM_VER}.tar.gz -C /tmp
          cmake -S "/tmp/libprojectM-${PROJECTM_VER}" -B /tmp/build-projectm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/build-projectm
          cmake --install /tmp/build-projectm
          ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci

      - name: Build native audio addon (aurivo_audio.node)
        run: npm --prefix native ci

      - name: Build projectM visualizer (aurivo-projectm-visualizer)
        run: |
          set -euo pipefail
          cmake -S visualizer -B build-visualizer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-visualizer
          mkdir -p native-dist/linux
          cp -f build-visualizer/aurivo-projectm-visualizer native-dist/linux/aurivo-projectm-visualizer
          for lib in libprojectM-4.so.4 libprojectM-4-playlist.so.4; do
            if [ -f "/usr/local/lib/$lib" ]; then
              cp -Lf "/usr/local/lib/$lib" "native-dist/linux/$lib"
            elif [ -f "/usr/local/lib/x86_64-linux-gnu/$lib" ]; then
              cp -Lf "/usr/local/lib/x86_64-linux-gnu/$lib" "native-dist/linux/$lib"
            else
              echo "Missing runtime library: $lib"
              exit 1
            fi
          done
          chmod +x native-dist/linux/aurivo-projectm-visualizer

      - name: Build Linux packages (AppImage/deb/rpm)
        run: npm run -s build:linux:appimage -- --publish=never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.yml

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: List artifacts
        run: |
          set -euo pipefail
          find release-artifacts -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/linux-dist/*.AppImage
            release-artifacts/linux-dist/*.AppImage.blockmap
            release-artifacts/linux-dist/*.deb
            release-artifacts/linux-dist/*.rpm
            release-artifacts/linux-dist/latest-linux.yml
