name: Publish 7.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-7.0.1.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    # This one-time bootstrap runs only for its publication commit.
    if: >-
      github.event.head_commit.message == 'release: start 7.0.1 publication'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for Linux CI on this exact commit
        run: |
          set -euo pipefail
          ci_run=''
          for attempt in $(seq 1 60); do
            ci_run="$(gh run list --workflow ci.yml --commit "${GITHUB_SHA}" --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "${ci_run}" ]; then break; fi
            sleep 10
          done
          test -n "${ci_run}"
          gh run watch "${ci_run}" --exit-status

      - name: Validate unpublished tag and move it to the verified commit
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${GITHUB_SHA}" --jq .content | base64 -d | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = '7.0.1'
          if gh release view v7.0.1 >/dev/null 2>&1; then
            echo 'v7.0.1 is already published; refusing to replace it' >&2
            exit 1
          fi
          old_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v7.0.1" --jq .object.sha)"
          test "${old_tag}" = '2e0ff718aecc8528a5c4d169a4531da96606e9bd'
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v7.0.1" \
            -f sha="${GITHUB_SHA}" -F force=true

      - name: Dispatch tagged release build
        run: gh workflow run release.yml --ref v7.0.1 -f release_ref=v7.0.1

  pacman:
    if: >-
      github.event.head_commit.message == 'release: publish 7.0.1 pacman package'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch package publication for the verified v7.0.1 release
        run: |
          set -euo pipefail
          test "$(gh release view v7.0.1 --json isDraft --jq .isDraft)" = 'false'
          gh workflow run pacman-repo.yml --ref main -f release_tag=v7.0.1
