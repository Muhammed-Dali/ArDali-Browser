name: Build (Linux)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "dali-lang/**"
      - "scripts/dali-*.js"
      - "scripts/install-dali-filetype-linux.sh"
      - ".github/workflows/dali-*.yml"
      - ".github/workflows/publish-dali-*.yml"
  pull_request:
    paths-ignore:
      - "dali-lang/**"
      - "scripts/dali-*.js"
      - "scripts/install-dali-filetype-linux.sh"
      - ".github/workflows/dali-*.yml"
      - ".github/workflows/publish-dali-*.yml"

# Avoid multiple queued runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for electron-builder to create/update GitHub Releases and upload assets (on tag builds).
permissions:
  contents: write

jobs:
  build-linux:
    if: >-
      ${{
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        !startsWith(github.event.head_commit.message, 'release: bump version')
      }}
    # PR builds use ubuntu-24.04 so GTK4/libadwaita requirements are available.
    # Release builds (tags) also use ubuntu-24.04 in `.github/workflows/release.yml`.
    runs-on: ubuntu-24.04

    env:
      # Keep these in sync with package.json build.electronVersion
      ELECTRON_VERSION: "40.6.1"

      # electron-builder uses hard links by default on CI; linking from /usr/bin (e.g. ffmpeg)
      # can fail on GitHub runners due to hardlink protections. Force file copies instead.
      USE_HARD_LINKS: "false"

      # Force node-gyp to build against Electron headers (not the host Node.js)
      npm_config_runtime: "electron"
      npm_config_target: "40.6.1"
      npm_config_disturl: "https://electronjs.org/headers"
      npm_config_build_from_source: "true"
      
      # GitHub token for Electron Builder
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            cmake \
            curl \
            ffmpeg \
            libchromaprint-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-4-dev \
            libfuse2 \
            libglm-dev \
            libglew-dev \
            libjpeg-dev \
            libpng-dev \
            libadwaita-1-dev \
            libasound2-dev \
            libpulse-dev \
            libsoup-3.0-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            ninja-build \
            pkg-config \
            python3 \
            rpm \
            zlib1g-dev

      # Ubuntu 20.04/22.04 ship an older libprojectM (v2.x/3.x) which doesn't provide the v4 C-API
      # used by our visualizer (projectm_create/projectm_destroy/...).
      # Build and install libprojectM v4 from source to get the required headers + libraries.
      - name: Build + install libprojectM v4
        run: |
          set -euo pipefail
          PROJECTM_VER="4.1.6"
          echo "Downloading libprojectM v${PROJECTM_VER}..."
          curl -fsSL -o /tmp/libprojectM-${PROJECTM_VER}.tar.gz \
            "https://sourceforge.net/projects/projectm.mirror/files/v${PROJECTM_VER}/libprojectM-${PROJECTM_VER}.tar.gz/download"
          tar -xzf /tmp/libprojectM-${PROJECTM_VER}.tar.gz -C /tmp

          echo "Building libprojectM..."
          cmake -S "/tmp/libprojectM-${PROJECTM_VER}" -B /tmp/build-projectm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/build-projectm
          sudo cmake --install /tmp/build-projectm
          sudo ldconfig

          # Make sure pkg-config can see /usr/local installs.
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci

      - name: Build native audio addon (aurivo_audio.node)
        run: npm --prefix native ci

      - name: Setup Rust toolchain (for Aurivo-Pulse)
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_INIT_SKIP_PATH_CHECK=yes
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"

          setup_rust() {
            source "$HOME/.cargo/env" 2>/dev/null || true
            command -v rustup >/dev/null 2>&1 || return 1
            rustup set profile minimal
            rustup toolchain install stable --no-self-update
            rustup default stable
            rustc --version
            cargo --version
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          }

          for attempt in 1 2 3 4 5; do
            echo "[rust-setup] attempt $attempt/5"
            if setup_rust; then
              echo "[rust-setup] ready"
              exit 0
            fi

            rm -f /tmp/rustup-init.sh
            if curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh; then
              sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable || true
            fi
            sleep $((attempt * 4))
          done

          echo "[rust-setup] failed after retries" >&2
          exit 1

      - name: Build Aurivo-Pulse binary
        run: |
          set -euo pipefail
          cargo build --release --manifest-path Aurivo-Pulse/Cargo.toml
          mkdir -p native-dist/linux
          cp -f Aurivo-Pulse/target/release/aurivo-pulse native-dist/linux/aurivo-pulse
          chmod +x native-dist/linux/aurivo-pulse

      - name: Build projectM visualizer (aurivo-projectm-visualizer)
        run: |
          set -euo pipefail
          cmake -S visualizer -B build-visualizer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-visualizer
          mkdir -p native-dist/linux
          cp -f build-visualizer/aurivo-projectm-visualizer native-dist/linux/aurivo-projectm-visualizer
          # Bundle libprojectM v4 runtime next to the visualizer so it works on distros
          # that don't ship projectM v4 (Arch/Fedora usually do, Ubuntu 22.04 doesn't).
          for lib in libprojectM-4.so.4 libprojectM-4-playlist.so.4; do
            if [ -f "/usr/local/lib/$lib" ]; then
              cp -Lf "/usr/local/lib/$lib" "native-dist/linux/$lib"
            elif [ -f "/usr/local/lib/x86_64-linux-gnu/$lib" ]; then
              cp -Lf "/usr/local/lib/x86_64-linux-gnu/$lib" "native-dist/linux/$lib"
            else
              echo "Missing runtime library: $lib (expected under /usr/local/lib)"
              exit 1
            fi
          done
          test -f native-dist/linux/aurivo-projectm-visualizer
          chmod +x native-dist/linux/aurivo-projectm-visualizer

      - name: Build Linux packages (AppImage/deb/rpm)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run -s build:linux:appimage

      - name: Verify AppImage contains pulse + adblock resources
        run: |
          set -euo pipefail
          appimage="$(ls -1 dist/*.AppImage | head -n1)"
          test -n "${appimage}"
          chmod +x "${appimage}"
          tmpdir="$(mktemp -d)"
          (
            cd "${tmpdir}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
          )
          test -f "${tmpdir}/squashfs-root/resources/native-dist/linux/aurivo-pulse"
          test -f "${tmpdir}/squashfs-root/resources/uDALİ-weman-home/chromium/manifest.json"
          echo "AppImage resource check OK: aurivo-pulse + uDALİ-weman-home/chromium"

      - name: Build + Publish (GitHub Release) on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run -s build:linux:appimage -- --publish=always

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-dist-${{ github.run_id }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.yml
