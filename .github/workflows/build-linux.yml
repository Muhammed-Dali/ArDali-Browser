name: Build (Linux)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "dali-lang/**"
      - "scripts/dali-*.js"
      - "scripts/install-dali-filetype-linux.sh"
  pull_request:
    paths-ignore:
      - "dali-lang/**"
      - "scripts/dali-*.js"
      - "scripts/install-dali-filetype-linux.sh"

# Avoid multiple queued runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required for electron-builder to create/update GitHub Releases and upload assets (on tag builds).
permissions:
  contents: read

jobs:
  build-linux:
    # Native ikilileri mümkün olan daha eski glibc üzerinde üretmek ileriye
    # uyumludur: Ubuntu 22.04 çıktısı yeni Ubuntu/Debian/Fedora/Arch'ta çalışır.
    runs-on: ubuntu-22.04

    env:
      # Keep these in sync with package.json build.electronVersion
      ELECTRON_VERSION: "40.8.5"

      # electron-builder uses hard links by default on CI; linking from /usr/bin (e.g. ffmpeg)
      # can fail on GitHub runners due to hardlink protections. Force file copies instead.
      USE_HARD_LINKS: "false"

      # Force node-gyp to build against Electron headers (not the host Node.js)
      npm_config_runtime: "electron"
      npm_config_target: "40.8.5"
      npm_config_disturl: "https://electronjs.org/headers"
      npm_config_build_from_source: "true"

      # GitHub token for Electron Builder
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Verify release metadata consistency
        run: npm run -s verify:release:metadata

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y \
            binutils \
            build-essential \
            cmake \
            curl \
            ffmpeg \
            libchromaprint-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-4-dev \
            libglm-dev \
            libglew-dev \
            libjpeg-dev \
            libpng-dev \
            libadwaita-1-dev \
            libasound2-dev \
            libpulse-dev \
            libsoup-3.0-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            ninja-build \
            pkg-config \
            python3 \
            rpm \
            zlib1g-dev
          sudo apt-get -o Acquire::Retries=5 install -y libfuse2 \
            || sudo apt-get -o Acquire::Retries=5 install -y libfuse2t64

      # Ubuntu 20.04/22.04 ship an older libprojectM (v2.x/3.x) which doesn't provide the v4 C-API
      # used by our visualizer (projectm_create/projectm_destroy/...).
      # Build and install libprojectM v4 from source to get the required headers + libraries.
      - name: Build + install libprojectM v4
        run: |
          set -euo pipefail
          PROJECTM_VER="4.1.6"
          echo "Downloading libprojectM v${PROJECTM_VER}..."
          curl -fsSL -o /tmp/libprojectM-${PROJECTM_VER}.tar.gz \
            "https://sourceforge.net/projects/projectm.mirror/files/v${PROJECTM_VER}/libprojectM-${PROJECTM_VER}.tar.gz/download"
          echo "1b9e6d56c59fe24e5416da4d42e941a34c982811003e43ac88b5aca8afa52c87  /tmp/libprojectM-${PROJECTM_VER}.tar.gz" | sha256sum -c -
          tar -xzf /tmp/libprojectM-${PROJECTM_VER}.tar.gz -C /tmp

          echo "Building libprojectM..."
          cmake -S "/tmp/libprojectM-${PROJECTM_VER}" -B /tmp/build-projectm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/build-projectm
          sudo cmake --install /tmp/build-projectm
          sudo ldconfig

          # Make sure pkg-config can see /usr/local installs.
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci

      - name: Build native audio addon (ardali_audio.node)
        run: npm --prefix native ci

      - name: Native audio latency/xrun smoke
        run: npm run -s native:audio:smoke

      - name: Build projectM visualizer (ardali-projectm-visualizer)
        run: |
          set -euo pipefail
          cmake -S visualizer -B build-visualizer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-visualizer
          mkdir -p native-dist/linux
          cp -f build-visualizer/ardali-projectm-visualizer native-dist/linux/ardali-projectm-visualizer
          # Bundle libprojectM v4 runtime next to the visualizer so it works on distros
          # that don't ship projectM v4 (Arch/Fedora usually do, Ubuntu 22.04 doesn't).
          for lib in libprojectM-4.so.4 libprojectM-4-playlist.so.4; do
            if [ -f "/usr/local/lib/$lib" ]; then
              cp -Lf "/usr/local/lib/$lib" "native-dist/linux/$lib"
            elif [ -f "/usr/local/lib/x86_64-linux-gnu/$lib" ]; then
              cp -Lf "/usr/local/lib/x86_64-linux-gnu/$lib" "native-dist/linux/$lib"
            else
              echo "Missing runtime library: $lib (expected under /usr/local/lib)"
              exit 1
            fi
          done
          test -f native-dist/linux/ardali-projectm-visualizer
          chmod +x native-dist/linux/ardali-projectm-visualizer

      - name: Build Linux packages (AppImage/deb/rpm)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run -s build:linux -- --publish=never

      - name: Verify AppImage contains native + bundled app resources
        run: |
          set -euo pipefail
          compgen -G "dist/*.deb" >/dev/null
          compgen -G "dist/*.rpm" >/dev/null
          appimage="$(ls -1 dist/*.AppImage | head -n1)"
          test -n "${appimage}"
          chmod +x "${appimage}"
          tmpdir="$(mktemp -d)"
          (
            cd "${tmpdir}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
          )
          root="${tmpdir}/squashfs-root"
          test -f "${root}/resources/app.asar"
          test -f "${root}/resources/native/build/Release/ardali_audio.node"
          test -f "${root}/resources/native/build/Release/libbass.so"
          test -f "${root}/resources/native-dist/linux/ardali-projectm-visualizer"
          test -f "${root}/resources/native-dist/linux/libprojectM-4.so.4"
          test -f "${root}/resources/native-dist/linux/libprojectM-4-playlist.so.4"
          npx asar list "${root}/resources/app.asar" | grep -qx '/modules/pulse/pulseService.js'
          npx asar list "${root}/resources/app.asar" | grep -qx '/modules/adblock-engine.js'
          npx asar list "${root}/resources/app.asar" | grep -qx '/modules/downloaderService.js'
          npx asar list "${root}/resources/app.asar" | grep -qx '/resources/adblock/rulesets/main/easylist.json'
          echo "AppImage resource check OK: bundled app, native audio, visualizer, pulse, downloader, adblock"

      - name: Build + Publish (GitHub Release) on tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run -s build:linux -- --publish=always

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-dist-${{ github.run_id }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/*.rpm
            dist/*.yml
