name: Native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ffmpeg git ninja nodejs openssl \
            qt6-base qt6-imageformats qt6-svg qt6-webengine \
            xorg-server-xvfb xorg-xauth

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure
        run: cmake -S browser -B browser/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build browser/build --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          # The three-window fixture is covered by the local and clean-package
          # gates; GitHub's nested container never starts its third renderer.
          xvfb-run -a ctest --test-dir browser/build --output-on-failure \
            -E '^browser-tab-attach-stress$'
