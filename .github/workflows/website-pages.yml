name: Publish Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - packaging/pacman/index.html
      - packaging/pacman/ardali.repo
      - .github/workflows/website-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble website and repository files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assemble Pages content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page_root="${RUNNER_TEMP}/ardali-pages"
          install -dm755 "${page_root}/x86_64"
          cp -a website/. "${page_root}/"
          install -Dm644 packaging/pacman/index.html "${page_root}/pacman.html"
          install -Dm644 packaging/pacman/ardali.repo "${page_root}/ardali.repo"

          # Preserve the historical Pages package paths while the official
          # pacman configuration continues to use GitHub Release assets.
          if gh release view pacman-repo >/dev/null 2>&1; then
            version="$(node -p "require('./package.json').version")"
            download_dir="${RUNNER_TEMP}/pacman-assets"
            install -dm755 "${download_dir}"
            gh release download pacman-repo --dir "${download_dir}" \
              --pattern 'ardali.db*' \
              --pattern 'ardali.files*' \
              --pattern "ardali-${version}-*.pkg.tar.zst"
            find "${download_dir}" -maxdepth 1 -type f -exec cp -f {} "${page_root}/" \;
            find "${download_dir}" -maxdepth 1 -type f -exec cp -f {} "${page_root}/x86_64/" \;
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/ardali-pages

  deploy:
    name: Deploy website to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
