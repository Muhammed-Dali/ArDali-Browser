name: Publish Pacman Repo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          )
        )
      }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Install build tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git curl pacman-contrib ffmpeg fuse2 github-cli

      - name: Build aurivo-bin package
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c 'cd "${GITHUB_WORKSPACE}/packaging/aur/aurivo-bin" && makepkg -f --noconfirm'

      - name: Generate pacman repo database
        run: |
          set -euo pipefail
          out_dir="${GITHUB_WORKSPACE}/pacman-repo/x86_64"
          mkdir -p "${out_dir}"

          pkg_path="$(find "${GITHUB_WORKSPACE}/packaging/aur/aurivo-bin" -maxdepth 1 -type f -name "aurivo-bin-*.pkg.tar.zst" | head -n1)"
          test -n "${pkg_path}"
          cp -f "${pkg_path}" "${out_dir}/"

          repo-add "${out_dir}/aurivo.db.tar.gz" "${out_dir}"/*.pkg.tar.zst

      - name: Publish as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out_dir="${GITHUB_WORKSPACE}/pacman-repo/x86_64"
          test -d "${out_dir}"

          if ! gh release view pacman-repo >/dev/null 2>&1; then
            gh release create pacman-repo \
              --title "Aurivo Pacman Repo" \
              --notes "Pacman repository assets (aurivo.db + aurivo-bin package)."
          fi

          gh release upload pacman-repo \
            "${out_dir}/aurivo.db.tar.gz" \
            "${out_dir}/aurivo.db" \
            "${out_dir}/aurivo.files.tar.gz" \
            "${out_dir}/aurivo.files" \
            "${out_dir}"/aurivo-bin-*.pkg.tar.zst \
            --clobber
