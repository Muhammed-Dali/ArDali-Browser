name: Publish Pacman Repo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pacman-repo.yml"
      - "packaging/aur/ardali-bin/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    permissions:
      contents: write
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.ref }}

      - name: Install build tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git curl pacman-contrib ffmpeg fuse2 github-cli nodejs

      - name: Verify release and AUR metadata consistency
        run: node scripts/verify-release-metadata.js --include-aur

      - name: Build ardali-bin package
        run: |
          set -euo pipefail
          pkg_dir="${GITHUB_WORKSPACE}/packaging/aur/ardali-bin"
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c "cd '${pkg_dir}' && makepkg -f --nodeps --noconfirm"

      - name: Generate pacman repo database
        run: |
          set -euo pipefail
          repo_root="${GITHUB_WORKSPACE}/pacman-repo"
          out_dir="${repo_root}/x86_64"
          mkdir -p "${out_dir}"
          cp -a "${GITHUB_WORKSPACE}/site/." "${repo_root}/"
          install -Dm644 "${GITHUB_WORKSPACE}/icons/app/ardali_readme_round.png" "${repo_root}/assets/ardali-logo.png"

          pkg_path="$(find "${GITHUB_WORKSPACE}/packaging/aur/ardali-bin" -maxdepth 1 -type f -name "ardali-*.pkg.tar.zst" | head -n1)"
          test -n "${pkg_path}"
          cp -f "${pkg_path}" "${out_dir}/"

          repo-add "${out_dir}/ardali.db.tar.gz" "${out_dir}"/*.pkg.tar.zst
          rm -f "${out_dir}/ardali.db" "${out_dir}/ardali.files"
          cp -f "${out_dir}/ardali.db.tar.gz" "${out_dir}/ardali.db"
          cp -f "${out_dir}/ardali.files.tar.gz" "${out_dir}/ardali.files"

          cat > "${repo_root}/ardali.repo" <<'EOF'
          [ardali]
          SigLevel = Optional TrustAll
          Server = https://muhammed-dali.github.io/ArDali-WebMedia/x86_64
          EOF

      - name: Publish as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out_dir="${GITHUB_WORKSPACE}/pacman-repo/x86_64"
          test -d "${out_dir}"

          if ! gh release view pacman-repo >/dev/null 2>&1; then
            gh release create pacman-repo \
              --title "ArDali Pacman Repo" \
              --notes "Pacman repository assets (ardali.db + ardali-bin package)."
          fi

          gh release upload pacman-repo \
            "${out_dir}/ardali.db.tar.gz" \
            "${out_dir}/ardali.db" \
            "${out_dir}/ardali.files.tar.gz" \
            "${out_dir}/ardali.files" \
            "${out_dir}"/ardali-*.pkg.tar.zst \
            --clobber

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pacman-repo

  deploy-pages:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pacman repo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
