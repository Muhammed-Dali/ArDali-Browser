name: Publish Pacman Repo

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published v-prefixed release tag to package
        required: true
        default: v6.1.2
        type: string

permissions:
  contents: read

concurrency:
  group: pacman-repo
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}

jobs:
  publish:
    name: Build and publish pacman package
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted packaging recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install packaging tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel git github-cli nodejs pacman-contrib

      - name: Validate release and package metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "${RELEASE_TAG}" = "v${version}"
          test "$(node -p "require('./package.json').version")" = "${version}"
          test "$(sed -n 's/^pkgver=//p' packaging/pacman/PKGBUILD)" = "${version}"
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          ci_run="$(gh run list --workflow ci.yml --commit "${release_sha}" --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "${ci_run}"
          gh run watch "${ci_run}" --exit-status

      - name: Build native binary package
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c "cd '${GITHUB_WORKSPACE}/packaging/pacman' && makepkg -f --nodeps --noconfirm"

      - name: Generate repository database and Pages content
        run: |
          set -euo pipefail
          repo_root="${GITHUB_WORKSPACE}/pacman-repo"
          out_dir="${repo_root}/x86_64"
          install -dm755 "${out_dir}"
          install -Dm644 packaging/pacman/index.html "${repo_root}/index.html"
          install -Dm644 packaging/pacman/ardali.repo "${repo_root}/ardali.repo"
          pkg_path="$(find packaging/pacman -maxdepth 1 -type f -name 'ardali-[0-9]*-x86_64.pkg.tar.zst' -print -quit)"
          test -n "${pkg_path}"
          install -Dm644 "${pkg_path}" "${out_dir}/$(basename "${pkg_path}")"
          repo-add "${out_dir}/ardali.db.tar.gz" "${out_dir}"/*.pkg.tar.zst
          rm -f "${out_dir}/ardali.db" "${out_dir}/ardali.files"
          cp -f "${out_dir}/ardali.db.tar.gz" "${out_dir}/ardali.db"
          cp -f "${out_dir}/ardali.files.tar.gz" "${out_dir}/ardali.files"

          # Keep both historical Pages server layouts working. Older users may
          # have configured the Pages root, while newer configs use /x86_64.
          cp -f "${out_dir}/ardali.db.tar.gz" "${repo_root}/ardali.db.tar.gz"
          cp -f "${out_dir}/ardali.db" "${repo_root}/ardali.db"
          cp -f "${out_dir}/ardali.files.tar.gz" "${repo_root}/ardali.files.tar.gz"
          cp -f "${out_dir}/ardali.files" "${repo_root}/ardali.files"
          cp -f "${pkg_path}" "${repo_root}/$(basename "${pkg_path}")"

      - name: Publish pacman repository release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out_dir="${GITHUB_WORKSPACE}/pacman-repo/x86_64"
          if ! gh release view pacman-repo >/dev/null 2>&1; then
            gh release create pacman-repo --title "ArDali Pacman Repo" --notes "ArDali Browser pacman repository assets."
          fi
          gh release upload pacman-repo \
            "${out_dir}/ardali.db.tar.gz" \
            "${out_dir}/ardali.db" \
            "${out_dir}/ardali.files.tar.gz" \
            "${out_dir}/ardali.files" \
            "${out_dir}"/ardali-*.pkg.tar.zst \
            --clobber

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pacman-repo

  deploy:
    name: Deploy pacman repository to GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
