name: Publish Pacman Repo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          )
        )
      }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Install build tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git curl pacman-contrib ffmpeg fuse2 github-cli

      - name: Build ardali-bin package
        run: |
          set -euo pipefail
          pkg_dir="${GITHUB_WORKSPACE}/packaging/aur/ardali-bin"
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          su builder -c "cd '${pkg_dir}' && makepkg -f --noconfirm"

      - name: Generate pacman repo database
        run: |
          set -euo pipefail
          repo_root="${GITHUB_WORKSPACE}/pacman-repo"
          out_dir="${repo_root}/x86_64"
          mkdir -p "${out_dir}"

          pkg_path="$(find "${GITHUB_WORKSPACE}/packaging/aur/ardali-bin" -maxdepth 1 -type f -name "ardali-bin-*.pkg.tar.zst" | head -n1)"
          test -n "${pkg_path}"
          cp -f "${pkg_path}" "${out_dir}/"

          repo-add "${out_dir}/ardali.db.tar.gz" "${out_dir}"/*.pkg.tar.zst
          cp -Lf "${out_dir}/ardali.db.tar.gz" "${out_dir}/ardali.db"
          cp -Lf "${out_dir}/ardali.files.tar.gz" "${out_dir}/ardali.files"

          cat > "${repo_root}/ardali.repo" <<'EOF'
[ardali]
SigLevel = Optional TrustAll
Server = https://muhammed-dali.github.io/ArDali-WebMedia/x86_64
EOF

          cat > "${repo_root}/index.html" <<'EOF'
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArDali Pacman Repo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; color: #dbeafe; background: #0b1220; }
      a { color: #67e8f9; }
      code, pre { background: #111827; border-radius: 8px; }
      pre { padding: 16px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>ArDali Pacman Repo</h1>
    <p>Add this repository to <code>/etc/pacman.conf</code>:</p>
    <pre>[ardali]
SigLevel = Optional TrustAll
Server = https://muhammed-dali.github.io/ArDali-WebMedia/x86_64</pre>
    <p>Then run:</p>
    <pre>sudo pacman -Sy
sudo pacman -S ardali-bin</pre>
    <p><a href="./ardali.repo">Download ardali.repo</a></p>
  </body>
</html>
EOF

      - name: Publish as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out_dir="${GITHUB_WORKSPACE}/pacman-repo/x86_64"
          test -d "${out_dir}"

          if ! gh release view pacman-repo >/dev/null 2>&1; then
            gh release create pacman-repo \
              --title "ArDali Pacman Repo" \
              --notes "Pacman repository assets (ardali.db + ardali-bin package)."
          fi

          gh release upload pacman-repo \
            "${out_dir}/ardali.db.tar.gz" \
            "${out_dir}/ardali.db" \
            "${out_dir}/ardali.files.tar.gz" \
            "${out_dir}/ardali.files" \
            "${out_dir}"/ardali-bin-*.pkg.tar.zst \
            --clobber

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pacman-repo

  deploy-pages:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pacman repo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
