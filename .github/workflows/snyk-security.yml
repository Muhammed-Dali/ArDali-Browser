name: Snyk Security Gate

on:
  workflow_run:
    workflows: ["Semgrep Security Gate"]
    types: [completed]
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  snyk:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch' ||
            github.event.workflow_run.event == 'workflow_run' ||
            github.event.workflow_run.event == 'release'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # Scan the real product code while skipping cloned repos, caches, and generated outputs.
      SNYK_EXCLUDES: ArDali-Medya-Player-Linux,ardali-bin,third_party,visualizer,build-visualizer,chromium.backup_20260328_182612,.semgrep-tmp,node_modules,dist,build,out,squashfs-root,.git,.cache,native-dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # master pinned 2026-07-14

      - name: Verify Snyk CLI
        run: snyk --version

      - name: Prepare Snyk report directory
        run: mkdir -p snyk-reports

      - name: Snyk Open Source (SCA) scan
        id: snyk_sca
        continue-on-error: true
        run: |
          set +e
          snyk test \
            --all-projects \
            --detection-depth=3 \
            --exclude="$SNYK_EXCLUDES" \
            --prune-repeated-subdependencies \
            --severity-threshold=high \
            --json-file-output=snyk-reports/snyk-sca.json \
            --sarif-file-output=snyk-reports/snyk-sca.sarif
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Snyk Code (SAST) scan
        id: snyk_code
        continue-on-error: true
        run: |
          set +e
          snyk code test \
            --exclude="$SNYK_EXCLUDES" \
            --severity-threshold=high \
            --json-file-output=snyk-reports/snyk-code.json \
            --sarif-file-output=snyk-reports/snyk-code.sarif
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Snyk reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-reports-${{ github.run_id }}
          path: snyk-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Snyk SCA SARIF
        if: always() && hashFiles('snyk-reports/snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          sarif_file: snyk-reports/snyk-sca.sarif
          category: snyk-open-source

      - name: Upload Snyk Code SARIF
        if: always() && hashFiles('snyk-reports/snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          sarif_file: snyk-reports/snyk-code.sarif
          category: snyk-code

      - name: Summarize Snyk findings
        if: always()
        run: |
          sca_errors=0
          sca_warnings=0
          code_errors=0
          code_warnings=0

          if [ -f snyk-reports/snyk-sca.sarif ]; then
            sca_errors=$(jq -r '[.runs[].results[]? | select(.level=="error")] | length' snyk-reports/snyk-sca.sarif 2>/dev/null || echo 0)
            sca_warnings=$(jq -r '[.runs[].results[]? | select(.level=="warning")] | length' snyk-reports/snyk-sca.sarif 2>/dev/null || echo 0)
          fi

          if [ -f snyk-reports/snyk-code.sarif ]; then
            code_errors=$(jq -r '[.runs[].results[]? | select(.level=="error")] | length' snyk-reports/snyk-code.sarif 2>/dev/null || echo 0)
            code_warnings=$(jq -r '[.runs[].results[]? | select(.level=="warning")] | length' snyk-reports/snyk-code.sarif 2>/dev/null || echo 0)
          fi

          echo "Snyk SCA findings: error=$sca_errors warning=$sca_warnings"
          echo "Snyk Code findings: error=$code_errors warning=$code_warnings"

      - name: Print top Snyk Code high/critical findings
        if: always() && hashFiles('snyk-reports/snyk-code.sarif') != ''
        run: |
          echo "Top Snyk Code high/critical findings (rule | file:line | message)"
          jq -r '
            [
              .runs[].results[]?
              | select(.level=="error")
              | {
                  rule: (.ruleId // "unknown-rule"),
                  file: (.locations[0].physicalLocation.artifactLocation.uri // "unknown-file"),
                  line: (.locations[0].physicalLocation.region.startLine // 0),
                  msg: (.message.text // "no message")
                }
            ]
            | .[:20]
            | .[]
            | "- \(.rule) | \(.file):\(.line) | \(.msg)"
          ' snyk-reports/snyk-code.sarif || true

      - name: Enforce Snyk security gate
        if: always()
        run: |
          sca_exit="${{ steps.snyk_sca.outputs.exit_code }}"
          code_exit="${{ steps.snyk_code.outputs.exit_code }}"
          [ -n "$sca_exit" ] || sca_exit=2
          [ -n "$code_exit" ] || code_exit=2

          echo "SCA exit code: $sca_exit"
          echo "Code exit code: $code_exit"

          if [ "$sca_exit" != "0" ] || [ "$code_exit" != "0" ]; then
            if [ "$code_exit" = "1" ]; then
              echo "::warning::Snyk Code found high/critical issues (CODE=1). Check SARIF findings in Security > Code scanning alerts."
            fi
            if [ "$sca_exit" = "1" ]; then
              echo "::warning::Snyk Open Source found high/critical issues (SCA=1)."
            fi
            if [ "$code_exit" = "2" ] || [ "$sca_exit" = "2" ]; then
              echo "::warning::Snyk could not run completely (likely token/plan/runtime limitation). Continuing without blocking pipeline."
            fi
            echo "::warning::Snyk security gate is configured as non-blocking (SCA=$sca_exit, CODE=$code_exit)."
            exit 0
          fi

      - name: Snyk Monitor (main branch only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          snyk monitor \
            --all-projects \
            --detection-depth=3 \
            --exclude="$SNYK_EXCLUDES"
