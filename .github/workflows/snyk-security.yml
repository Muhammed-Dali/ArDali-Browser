name: Snyk Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release_v2_0_12_clean
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # Scan the real product code while skipping cloned repos, caches, and generated outputs.
      SNYK_EXCLUDES: Aurivo-Medya-Player-Linux,aurivo-bin,chromium.backup_20260328_182612,.semgrep-tmp,node_modules,dist,build,out,squashfs-root,.git,.cache,native-dist
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Verify Snyk CLI
        run: snyk --version

      - name: Prepare Snyk report directory
        run: mkdir -p snyk-reports

      - name: Snyk Open Source (SCA) scan
        id: snyk_sca
        continue-on-error: true
        run: |
          set +e
          snyk test \
            --all-projects \
            --detection-depth=3 \
            --exclude="$SNYK_EXCLUDES" \
            --prune-repeated-subdependencies \
            --severity-threshold=high \
            --json-file-output=snyk-reports/snyk-sca.json \
            --sarif-file-output=snyk-reports/snyk-sca.sarif
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Snyk Code (SAST) scan
        id: snyk_code
        continue-on-error: true
        run: |
          set +e
          snyk code test \
            --exclude="$SNYK_EXCLUDES" \
            --severity-threshold=high \
            --json-file-output=snyk-reports/snyk-code.json \
            --sarif-file-output=snyk-reports/snyk-code.sarif
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Snyk reports artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: snyk-reports-${{ github.run_id }}
          path: snyk-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Snyk SCA SARIF
        if: always() && hashFiles('snyk-reports/snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-reports/snyk-sca.sarif
          category: snyk-open-source

      - name: Upload Snyk Code SARIF
        if: always() && hashFiles('snyk-reports/snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-reports/snyk-code.sarif
          category: snyk-code

      - name: Summarize Snyk findings
        if: always()
        run: |
          sca_errors=0
          sca_warnings=0
          code_errors=0
          code_warnings=0

          if [ -f snyk-reports/snyk-sca.sarif ]; then
            sca_errors=$(jq -r '[.runs[].results[]? | select(.level=="error")] | length' snyk-reports/snyk-sca.sarif 2>/dev/null || echo 0)
            sca_warnings=$(jq -r '[.runs[].results[]? | select(.level=="warning")] | length' snyk-reports/snyk-sca.sarif 2>/dev/null || echo 0)
          fi

          if [ -f snyk-reports/snyk-code.sarif ]; then
            code_errors=$(jq -r '[.runs[].results[]? | select(.level=="error")] | length' snyk-reports/snyk-code.sarif 2>/dev/null || echo 0)
            code_warnings=$(jq -r '[.runs[].results[]? | select(.level=="warning")] | length' snyk-reports/snyk-code.sarif 2>/dev/null || echo 0)
          fi

          echo "Snyk SCA findings: error=$sca_errors warning=$sca_warnings"
          echo "Snyk Code findings: error=$code_errors warning=$code_warnings"

      - name: Enforce Snyk security gate
        if: always()
        run: |
          sca_exit="${{ steps.snyk_sca.outputs.exit_code }}"
          code_exit="${{ steps.snyk_code.outputs.exit_code }}"
          [ -n "$sca_exit" ] || sca_exit=2
          [ -n "$code_exit" ] || code_exit=2

          echo "SCA exit code: $sca_exit"
          echo "Code exit code: $code_exit"

          if [ "$sca_exit" != "0" ] || [ "$code_exit" != "0" ]; then
            if [ "$code_exit" = "1" ]; then
              echo "::error::Snyk Code found high/critical issues (CODE=1). Check SARIF findings in Security > Code scanning alerts."
            fi
            if [ "$sca_exit" = "1" ]; then
              echo "::error::Snyk Open Source found high/critical issues (SCA=1)."
            fi
            echo "::error::Snyk security gate failed (SCA=$sca_exit, CODE=$code_exit)."
            exit 1
          fi

      - name: Snyk Monitor (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          snyk monitor \
            --all-projects \
            --detection-depth=3 \
            --exclude="$SNYK_EXCLUDES"
