name: Bug report
description: Report a reproducible problem in ArDali WebMedia
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ArDali. Search existing issues first. Do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: ArDali version
      description: Find this in the application About dialog or package metadata.
      placeholder: "Example: 5.2.16"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installation type
      options:
        - AppImage
        - AUR / ardali-bin
        - DEB
        - RPM
        - Flatpak
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution/version, architecture, desktop environment, and X11 or Wayland.
      placeholder: "Arch Linux, x86_64, KDE Plasma 6, Wayland"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Remove tokens, cookies, personal paths, and other sensitive information. Add screenshots if useful.
      render: shell
  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Always
        - Often
        - Sometimes
        - Once
    validations:
      required: true
