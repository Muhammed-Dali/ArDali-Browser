name: Bug report
description: Report a reproducible problem in ArDali Browser
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: ArDali Browser version
      placeholder: "6.1.2"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution/version, architecture, desktop environment, and X11 or Wayland.
      placeholder: "Arch Linux, x86_64, KDE Plasma 6, Wayland"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Remove tokens, cookies, personal paths, and other sensitive information.
      render: shell
